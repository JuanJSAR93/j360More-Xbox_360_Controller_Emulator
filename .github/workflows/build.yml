name: Build & Release (Windows & Linux)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: windows-latest
            python_arch: x64
            viiper_src: bin/viiper-amd64.exe
          - arch: arm64
            os: windows-11-arm
            python_arch: arm64
            viiper_src: bin/viiper_arm64.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}
          cache: 'pip'

      - name: Bypass ViGEmBus interactive GUI installer in CI
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\ViGEmBus" /v "DisplayName" /d "Nefarius Virtual Gamepad Emulation Bus Driver" /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\ViGEmBus" /v "DisplayVersion" /d "1.17.333.0" /f

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Windows Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --noupx `
            --name "j360More" `
            --icon "assets/icon.ico" `
            --version-file "version_info.txt" `
            --add-data "assets;assets" `
            --add-data "bin;bin" `
            --collect-all "vgamepad" `
            --collect-all "resvg_py" `
            gui_app.py

      - name: Package Windows Release
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { "v1.5.1" }
          New-Item -ItemType Directory -Path "dist/pkg/bin" -Force | Out-Null
          Copy-Item "dist/j360More.exe" "dist/pkg/" -Force
          $vsrc = "${{ matrix.viiper_src }}"
          if (Test-Path $vsrc) {
              Copy-Item $vsrc "dist/pkg/bin/viiper.exe" -Force
          } elseif (Test-Path "bin/viiper.exe") {
              Copy-Item "bin/viiper.exe" "dist/pkg/bin/viiper.exe" -Force
          }
          $zipName = "j360More-$ver-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path "dist/pkg/*" -DestinationPath "dist/$zipName" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: j360More-Windows-${{ matrix.arch }}
          path: dist/*windows-${{ matrix.arch }}*.zip

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container and Compile Binary
        run: |
          docker build --platform ${{ matrix.platform }} -f Dockerfile.linux_build -t j360more-builder:${{ matrix.arch }} .
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/workspace" -w /workspace j360more-builder:${{ matrix.arch }} bash build_linux.sh

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: j360More-Linux-${{ matrix.arch }}
          path: dist/j360More-*-linux-${{ matrix.arch }}.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Inspect Artifacts for Release
        run: ls -la release-artifacts/

      - name: Determine Release Metadata
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            if [[ "$TAG" =~ -(pre|rc|beta|alpha) ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
            echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
            echo "release_name=j360More $TAG" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=v1.5.1-pre" >> "$GITHUB_OUTPUT"
            echo "release_name=j360More v1.5.1 (Pre-release)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          draft: false
          files: release-artifacts/*
          generate_release_notes: true
