name: Build & Release (Windows & Linux)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bypass ViGEmBus interactive GUI installer in CI
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\ViGEmBus" /v "DisplayName" /d "Nefarius Virtual Gamepad Emulation Bus Driver" /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\ViGEmBus" /v "DisplayVersion" /d "1.17.333.0" /f

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Windows Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --noupx `
            --name "j360More" `
            --icon "assets/icon.ico" `
            --version-file "version_info.txt" `
            --add-data "assets;assets" `
            --add-data "bin;bin" `
            --collect-all "vgamepad" `
            --collect-all "resvg_py" `
            gui_app.py

      - name: Package Windows Release
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { "v1.5.0" }
          New-Item -ItemType Directory -Path "dist/pkg/bin" -Force | Out-Null
          Copy-Item "dist/j360More.exe" "dist/pkg/" -Force
          if (Test-Path "bin/viiper.exe") { Copy-Item "bin/viiper.exe" "dist/pkg/bin/viiper.exe" -Force }
          $zipName = "j360More-$ver-windows-x86_64.zip"
          Compress-Archive -Path "dist/pkg/*" -DestinationPath "dist/$zipName" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: j360More-Windows-x64
          path: dist/*windows*.zip

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container and Compile Binary
        run: |
          docker build --platform ${{ matrix.platform }} -f Dockerfile.linux_build -t j360more-builder:${{ matrix.arch }} .
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/workspace" -w /workspace j360more-builder:${{ matrix.arch }} bash build_linux.sh

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: j360More-Linux-${{ matrix.arch }}
          path: dist/j360More-*-linux-${{ matrix.arch }}.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List Artifacts for Release
        run: ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
